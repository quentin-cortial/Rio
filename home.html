<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<audio id="sonOuverture" src="ouverture.mp3"></audio>
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f1e7d3;
    font-family: Arial, sans-serif;
}

/* Zone de l'enveloppe */
.enveloppe {
    position: relative;
    width: 360px;
    height: 240px;
    cursor: pointer;
    perspective: 1000px;
}

/* Corps de l'enveloppe */
.corps {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 180px;
    background: #e8b96d;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 12px 25px rgba(0,0,0,0.2);
}

/* Les deux rabats inférieurs */
.corps::before,
.corps::after {
    content: "";
    position: absolute;
    bottom: 0;
    width: 0;
    height:0;
    border-style: solid;
    z-index: 2;
}

.corps::before {
    right: 0;
    border-width: 0 180px 120px 0;
    border-color: transparent #dca85e transparent transparent;
    transform: rotate(180deg);
    
}

.corps::after {
    left: 0;
    border-width: 120px 180px 0 0;
    border-color: #dca85e transparent transparent transparent;
    transform: rotate(-180deg);
    
}

/* Lettre */
.lettre {
    visibility: hidden;
    position: absolute;
    z-index: 1;
    left: 25px;
    bottom: 20px;
    width: 310px;
    height: 180px;
    background: white;
    padding: 25px;
    text-align: center;
    border-radius: 3px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);

    transform: translateY(0);
    transition: transform 1s ease 0.3s;
}

.lettre h2 {
    margin: 10px 0;
    color: #444;
}

.lettre p {
    color: #666;
}

/* Rabat supérieur */
.rabat {
    position: absolute;
    top: 60px;
    left: 0;
    width: 0;
    height: 0;
    border-left: 180px solid transparent;
    border-right: 180px solid transparent;
    border-top: 120px solid #f0c47c;
    transform-origin: top center;
    transform: rotateX(0deg);
    transition: transform 1s ease;
    z-index: 3;
}

/* Quand on clique */
.enveloppe.ouverte .rabat {
    transform: rotateX(180deg);
}

.enveloppe.ouverte .lettre {
    transform: translateY(-120px);
    visibility: visible;
    z-index: 4;
}

/* Petit texte */
.instructions {
    position: absolute;
    bottom: -55px;
    width: 100%;
    text-align: center;
    color: #555;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="enveloppe" onclick="this.classList.toggle('ouverte')">

    <div class="lettre">
        <h2>💌 Surprise !💌</h2>
        <p>Je t’aime mon petit lion.</p>
    </div>

    <div class="corps"></div>

    <div class="rabat"></div>

    <div class="instructions">
        Cliquez sur l'enveloppe
    </div>

</div>

</body>
    <script>
function ouvrirEnveloppe() {

    const enveloppe = document.querySelector(".enveloppe");
    const son = document.querySelector("#sonOuverture");

    enveloppe.classList.toggle("ouverte");

    // Jouer le son uniquement à l'ouverture
    if (enveloppe.classList.contains("ouverte")) {
        son.currentTime = 0;
        son.play();
    }
}
    </script>
</html>
